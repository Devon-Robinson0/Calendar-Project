<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Project</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <h1><a href="/src/index.html">Calendar Project</a></h1>
        <div id="days-container">
            <h2>Monday</h2>
            <h2>Tuesday</h2>
            <h2>Wednesday</h2>
            <h2>Thursday</h2>
            <h2>Friday</h2>
            <h2 class="weekend">Saturday</h2>
            <h2 class="weekend">Sunday</h2>
        </div>
    </header>
    
    <div id="hovering-month-text-container">
        <p id="hovering-month-text">January</p>
    </div>

    <main>
        <div id="cell-container">
            
        </div>
        <div id="upload-btn-container">
            <button id="upload-btn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-200h80v-167l64 64 56-57-160-160-160 160 57 56 63-63v167ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg></button>
        </div>

        <div id="upload-modal" class="modal">
            <div class="modal-content">
                <h2>Drop ical file: </h2>
                <div id="ical-input-container">
                    <input type="file" id="ical-input" accept=".ics" />
                </div>
                <div class="btn-container">
                    <button>Confirm</button>
                    <button id="cancel-upload-btn">Cancel</button>
                </div>
            </div>
        </div>

        
    </main>
    <script src="./js/script.js" defer></script>
</body>
</html>
