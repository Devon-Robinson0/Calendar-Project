<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Project</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="/src/index.html">Calendar Project</a></h1>
        <div id="date-container">
            <h2 id="current-date">Date: </h2>
        </div>
    </header>
    <main>
        <div id="event-container">
            
        </div>

        <div id="create-event-modal" class="modal">
            <div class="modal-content">
                <div id="colour-container">   
                    <div id="selected-colour"></div>
                    <div id="swatch-container">
                        <button id="swatch-red" class="swatch red"></button>
                        <button id="swatch-orange" class="swatch orange"></button>
                        <button id="swatch-yellow" class="swatch yellow"></button>
                        <button id="swatch-green" class="swatch green"></button>
                        <button id="swatch-teal" class="swatch teal"></button>
                        <button id="swatch-blue" class="swatch blue"></button>
                        <button id="swatch-violet" class="swatch violet"></button>
                        <button id="swatch-pink" class="swatch pink"></button>
                    </div>
                </div>
                

                <div class="form-row">
                    <h2><input id="title-input" type="text" value="New Event" /></h2>
                </div>

                <div class="form-row">
                        <label for="start-date">Date: </label>
                    <div id="date-range" class="inline-column">
                        <input id="start-date" type="date" />
                        <label for="end-date">--></label>
                        <input id="end-date" type="date" />
                    </div>
                </div>

                <div class="form-row">
                    <label for="all-day-checkbox">All-Day: </label>
                    <input id="all-day-checkbox" type="checkbox" />
                </div>
                
                <div class="form-row">
                    <label for="time-start-input">Time:</label>
                    <div class="inline-column">
                        <div id="start-time-container">
                            <input id="time-start-input" type="time" placeholder="XX:XX" size="10"/>
                            <!-- <select id="meridiam-start-input">
                                <option value="am" selected>AM</option>
                                <option value="pm">PM</option>
                            </select> -->
                        </div>
                        <select id="time-finish-type" class="hidden-dropdown">
                            <option value="to">to</option>
                            <option value="duration">duration:</option>
                        </select>

                        <div id="to-container">
                            <input id="time-end-input" type="time" placeholder="XX:XX" size="10"/>
                            <!-- <select id="meridiam-end-input">
                                <option value="am" selected>AM</option>
                                <option value="pm">PM</option>
                            </select> -->
                        </div>
                        <div id="duration-container">
                            <input id="duration-input" type="text" placeholder="XX:XX" size="10"/>
                        </div>
                        <!-- <input id="time-finish-input" type="text" placeholder="XX:XX" size="10"/>
                        <select id="meridiam-end-input">
                            <option value="am" selected>AM</option>
                            <option value="pm">PM</option>
                        </select> -->
                    </div>
                </div>

                <div class="form-row">
                    <label for="dow-checkbox-container">Repeat: </label>
                    <div class="inline-column">
                        <select id="repeat-dropdown">
                            <option value="never">Never</option>
                            <option value="week">Every week</option>
                        </select>

                        <select id="repeat-until-select" class="hidden-dropdown">
                            <option value="forever" selected>Forever</option>
                            <option value="until">Until</option>
                        </select>
                        <input id="repeat-until-date" type="date" />
                    </div>
                </div>

                <div class="form-row" id="dow-selector">
                    <label></label>
                    <div id="dow-checkbox-container">
                        <label class="checkbox-btn">
                            <input id="monday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>M</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="tuesday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>T</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="wednesday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>W</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="thursday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>T</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="friday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>F</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="saturday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>S</span>
                        </label>
                        <label class="checkbox-btn">
                            <input id="sunday-checkbox" type="checkbox" class="dow-checkbox" />
                            <span>S</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-row">
                    <label for="location-input">location:</label>
                    <input id="location-input" type="text" placeholder="enter location here" size="30"/>
                </div>
                
                <div class="form-row">
                    <label for="description-input">Description: </label>
                    <textarea id="description-input" type="text" placeholder="enter Description here" size="40"></textarea>
                </div>

                <div id="alert-box">
                    <p id="alert-text">ALERT: err</p>
                </div>

                <div id="confirm-event-btn-container" aria-live="assertive">
                    <button id="confirm-event-btn">Confirm</button>
                    <button id="cancel-event-btn">Cancel</button>
                </div>
            </div>
        </div>
    
        <div id="confirm-del-modal" class="modal">
            <div class="modal-content">
                <h2>Confirm Delete: </h2>
                <div id="confirm-del-btn-container">
                    <button id="confirm-del-btn" class="dark-btn" type="button">Confirm</button>
                    <button id="cancel-del-btn" class="light-btn" type="button">Cancel</button>
                </div>
            </div>
        </div>

        <div id="add-btn-container">
            <button id="add-btn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></button>
        </div>
    </main>
    <script type="module" src="../js/date-page.js" defer></script>
</body>
</html>
