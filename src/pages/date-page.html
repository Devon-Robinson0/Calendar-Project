<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Project</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="/src/index.html">Calendar Project</a></h1>
        <div id="date-container">
            <h2 id="current-date">Date: </h2>
        </div>
    </header>
    <main>
        <div id="event-container">
            
        </div>

        <div id="create-event-modal" class="modal">
            <div class="modal-content">
                <h2>
                    <input id="title-input" type="text" value="New Event" />
                </h2>
                
                <div>
                    <label>Time: 
                        <input id="time-input" type="text" placeholder="XX:XX" size="10"/>
                    </label>
                    <select id="meridiam-input">
                        <option value="am" selected>AM</option>
                        <option value="pm">PM</option>
                    </select>
                </div>
                <label>location: 
                    <input id="location-input" type="text" placeholder="enter location here" size="30"/>
                </label>
                <label for="description-input">Description: </label>
                <textarea id="description-input" type="text" placeholder="enter Description here" size="40"></textarea>

                <div id="confirm-event-btn-container">
                    <button id="confirm-event-btn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></button>
                </div>
            </div>
        </div>
        <div id="edit-event-modal" class="modal">
            <div class="modal-content">
                <h2>
                    <input id="title-edit-input" type="text" />
                </h2>
                
                <div>
                    <label>Time: 
                        <input id="time-edit-input" type="text" placeholder="XX:XX" size="10"/>
                    </label>
                    <select id="meridiam-edit-input">
                        <option value="am" selected>AM</option>
                        <option value="pm">PM</option>
                    </select>
                </div>
                <label>location: 
                    <input id="location-edit-input" type="text" placeholder="enter location here" size="30"/>
                </label>
                <label for="description-edit-input">Description: </label>
                <textarea id="description-edit-input" type="text" placeholder="enter Description here" size="40"></textarea>

                <div id="confirm-edit-btn-container">
                    <button id="confirm-edit-btn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></button>
                </div>
            </div>
        </div>
        <div id="confirm-del-modal" class="modal">
            <div class="modal-content">
                <h2>Confirm Delete: </h2>
                <div id="confirm-del-btn-container">
                    <button id="confirm-del-btn" type="button">Confirm</button>
                    <button id="cancel-del-btn" type="button">Cancel</button>
                </div>
            </div>
        </div>

        <div id="add-btn-container">
            <button id="add-btn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></button>
        </div>
    </main>
    <script type="module" src="../js/date-page.js"></script>
</body>
</html>
